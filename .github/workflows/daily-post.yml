name: Daily Post Generation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Тема поста (оставь пусто — авто)'
        required: false
        default: ''
      article_topic:
        description: 'Тема статьи для Дзена (заполни, чтобы сгенерировать статью на эту тему)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python generator.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          LOGIST_TG_ID: ${{ secrets.LOGIST_TG_ID }}
          OPENAI_LIKE_API_KEY: ${{ secrets.OPENAI_LIKE_API_KEY }}
          OPENAI_LIKE_API_BASE_URL: https://api.vsellm.ru/v1
          LLM_MODEL: openai/gpt-4o-mini
          IMAGE_MODEL: openai/gpt-image-1-mini
          ARTICLE_MODEL: openai/gpt-4o-mini
          ARTICLE_CUSTOM_TITLE: ${{ inputs.article_topic }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: smtp.mail.ru
          SMTP_PORT: 465
      - name: Commit article state
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add article_state.json post_history.json topic_state.json articles
          git commit -m "chore: update article topic state" || echo "No changes to commit"
          git push
