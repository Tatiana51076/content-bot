name: Daily Post Generation

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Тема поста (оставь пусто — авто)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python generator.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          LOGIST_TG_ID: ${{ secrets.LOGIST_TG_ID }}
          OPENAI_LIKE_API_KEY: ${{ secrets.OPENAI_LIKE_API_KEY }}
          OPENAI_LIKE_API_BASE_URL: https://api.vsellm.ru/v1
          LLM_MODEL: deepseek/deepseek-v4-flash
          IMAGE_MODEL: openai/gpt-image-1-mini
